name: Build The Yappologist

# Builds the macOS app on a GitHub-hosted Mac and uploads the .app as an artifact.
# No signing secrets needed — the project is configured for ad-hoc signing.

on:
  push:
    branches: [main, master]
    tags: ["v*"]       # tagging cuts a permanent release
  pull_request:
  workflow_dispatch:   # lets you trigger a build by hand from the Actions tab

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write  # needed to publish a release

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      # -derivedDataPath would require -scheme, and this project has no shared scheme.
      # CONFIGURATION_BUILD_DIR puts the product where we want it using -target instead.
      - name: Build (Release)
        run: |
          xcodebuild \
            -project echo/echo.xcodeproj \
            -target echo \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # ditto (not zip) preserves the .app bundle's symlinks and permissions.
      # The README ships inside the same zip so the download is self-explanatory.
      - name: Package app + instructions
        run: |
          mkdir -p "release/The Yappologist"
          cp -R "build/The Yappologist.app" "release/The Yappologist/"
          cp "READ ME FIRST.txt" "release/The Yappologist/"
          cd release
          ditto -c -k --sequesterRsrc --keepParent \
            "The Yappologist" "The Yappologist.zip"

      - name: Verify architectures
        run: lipo -archs "build/The Yappologist.app/Contents/MacOS/The Yappologist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Yappologist
          path: release/The Yappologist.zip
          if-no-files-found: error

      # Artifacts expire after 90 days; a release keeps the build permanently and
      # gives you something known-good to roll back to.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/The Yappologist.zip
          generate_release_notes: true
